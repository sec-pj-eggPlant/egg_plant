<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>가지 : 배송대행 신청</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/global.css"/>
</head>
<body>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="row signup-box w-100" style="max-width: 960px;">
        <div class="col-md-6 d-flex justify-content-center align-items-center px-4">
            <img src="/images/logo.svg" alt="logo" class="w-100"/>
        </div>

        <div class="col-md-6 px-4">
            <h2 class="mb-5">배송대행 신청</h2>
            <form th:action="@{/BDJ/request}" method="post" th:object="${requestDto}">

                <!-- 수령인 이름/연락처는 보여주기만 -->
                <div class="mb-3">
                    <label class="form-label fw-bold">수령인 이름</label>
                    <input type="text" class="form-control" th:value="${member.userName}" readonly/>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">연락처</label>
                    <input type="text" class="form-control" th:value="${member.tel}" readonly/>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">트래킹 번호</label>
                    <input type="text" class="form-control" th:field="*{trackingNumber}" required/>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">기본 주소</label>
                    <input type="text" class="form-control" th:field="*{address}" placeholder="도로명 주소 또는 지번 주소"
                           required/>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">상세 주소</label>
                    <input type="text" class="form-control" th:field="*{addressDetail}" placeholder="동/호수 등 상세주소"/>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">우편번호</label>
                    <input type="text" class="form-control" th:field="*{postalCode}" required/>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">개인통관고유번호</label>
                    <input type="text" class="form-control" th:field="*{clearanceCode}" placeholder="P로 시작하는 번호"
                           required/>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">상품명</label>
                    <input type="text" class="form-control" th:field="*{itemName}" required/>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">상품 가격 (원)</label>
                    <input type="number" class="form-control" th:field="*{itemPrice}" required/>
                </div>

                <button type="submit" class="btn btn-primary w-100">배송대행 신청하기</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
