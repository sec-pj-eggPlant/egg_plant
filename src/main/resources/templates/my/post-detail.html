<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>게시글 상세보기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
          crossorigin="anonymous"/>
    <style>
        th, td {
            vertical-align: middle;
        }
    </style>
</head>
<body>
<div class="container mt-5 mb-5">
    <h2 class="mb-4" th:text="${post.title}">게시글 제목</h2>

    <table class="table table-bordered text-center">
        <tbody>
        <tr>
            <th style="width: 15%;">글 번호</th>
            <td th:text="${post.postId}">1</td>
        </tr>
        <tr>
            <th>지역</th>
            <td th:text="${post.location}">서울</td>
        </tr>
        <tr>
            <th>상태</th>
            <td>
            <span th:switch="${post.status}">
              <span th:case="'ACTIVE'">거래가능</span>
              <span th:case="'IN_PROGRESS'">거래중</span>
              <span th:case="'DONE'">거래완료</span>
              <span th:case="*">알 수 없음</span>
            </span>
            </td>
        </tr>
        <tr>
            <th>금액</th>
            <td th:text="${post.price} + '원'">100000원</td>
        </tr>
        <tr>
            <th>면적</th>
            <td th:text="${post.area} + '㎡'">10㎡</td>
        </tr>
        <tr>
            <th>임대기간</th>
            <td>
                <span th:text="${#temporals.format(post.startDate, 'yyyy-MM-dd')}"></span>
                ~
                <span th:text="${#temporals.format(post.endDate, 'yyyy-MM-dd')}"></span>
            </td>
        </tr>
        <tr>
            <th>내용</th>
            <td th:text="${post.content}" style="white-space: pre-line;"></td>
        </tr>
        </tbody>
    </table>

    <div class="text-end mt-4">
        <a href="/my/post" class="btn btn-secondary">목록으로</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
</body>
</html>
