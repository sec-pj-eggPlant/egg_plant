<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>거래글 작성</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/write.css" />
    <style>
      :root {
        --bs-primary: #5f328e; /* 예: 보라색으로 변경 */
      }
      /* 스핀 버튼 제거 (가격, 면적 input용) */
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      input[type="number"] {
        -moz-appearance: textfield;
      }
    </style>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header id="header">
      <div class="container">
        <h1>
          <a href=""><img src="../images/logo.svg" alt="" /></a>
        </h1>
        <nav>
          <ul>
            <li><a href="">자사창고</a></li>
            <li><a href="">빌려드림</a></li>
          </ul>
        </nav>
        <div class="search-box">
          <form action="">
            <input type="text" class="form-control" placeholder="search" />
            <button class="btn" type="button">search</button>
          </form>
        </div>
        <a href="" id="profile">
          <span>김의진</span>
          <span class="img">
            <img src="../images/profile.jpg" alt="" />
          </span>
        </a>
      </div>
    </header>
    <div class="container min-vh-100 py-5 write-wrap">
      <div class="row justify-content-center">
        <div class="col-md-6"> <!-- 중앙 정렬과 적절한 너비 설정 -->

          <form method="post" action="/main/write" enctype="multipart/form-data">
            <!-- 사진 첨부 (임대인만 보이게) -->
            <div class="mb-4" th:if="${role == 'ROLE_OWNER'}">
              <label class="form-label fw-bold">사진 첨부</label>
              <input type="file" class="form-control" name="imageFile" accept="image/*">
            </div>

            <!-- 제목 -->
            <div class="mb-4">
              <label class="form-label fw-bold">제목</label>
              <input type="text" class="form-control" name="title" required>
            </div>

            <!-- 상세 설명 -->
            <div class="mb-4">
              <label class="form-label fw-bold">상세 설명</label>
              <textarea class="form-control" name="content" rows="4" required></textarea>
            </div>

            <!-- 가격 -->
            <div class="mb-4">
              <label class="form-label fw-bold">가격 (원)</label>
              <input type="number" class="form-control" name="price" required>
            </div>

            <!-- 지역 -->
            <div class="mb-4">
              <label class="form-label fw-bold">지역</label>
              <select class="form-select" name="location" required>
                <option value="">지역 선택</option>
                <option value="서울 강남구">서울 강남구</option>
                <option value="서울 마포구">서울 마포구</option>
                <option value="부산 해운대구">부산 해운대구</option>
                <option value="대구 수성구">대구 수성구</option>
              </select>
            </div>

            <!-- 면적 -->
            <div class="mb-4">
              <label class="form-label fw-bold">면적 (평)</label>
              <input type="number" class="form-control" name="area" required>
            </div>

            <!-- 기간 -->
            <div class="mb-4">
              <label class="form-label fw-bold">대여 가능 기간</label>
              <div class="row g-2">
                <div class="col">
                  <input type="date" class="form-control" name="startDate" required>
                </div>
                <div class="col-auto d-flex align-items-center">-</div>
                <div class="col">
                  <input type="date" class="form-control" name="endDate" required>
                </div>
              </div>
            </div>

            <!-- 버튼 -->
            <div class="text-center mt-5">
              <button type="submit" class="btn btn-primary btn-lg">작성하기</button>
            </div>
          </form>

        </div>
      </div>
    </div>
    <footer>
      <div class="container">
        <div class="row pt-5">
          <div class="col-7">
            <ul class="d-flex gap-3">
              <li><a href="">이용약관</a></li>
              <li><a href="">개인정보처리방침</a></li>
              <li><a href="">위치기반서비스</a></li>
              <li><a href="">이용약관</a></li>
              <li><a href="">이메일 무단수집거부</a></li>
              <li><a href="">법적고지</a></li>
              <li><a href="">사업자정보</a></li>
            </ul>
          </div>
          <div class="col-5">
            <p>
              대표이사 : 이몽룡 | 개인정보보호책임자 : 임춘향 | 사업자등록번호 :
              8282-82-828282
            </p>
            <p>
              통신판매업종신고 : 제 2025-서울강남구-8282 | 대표이메일 :
              gagi@gagi.store
            </p>
            <p>
              copyright ⓒ 2021. 가지 : 가장가까운지역창고 Co., Ltd. All rights
              reserved.
            </p>
          </div>
        </div>
      </div>
    </footer>
  </body>
  <script>
    // This is an example script, please modify as needed
    const rangeInput = document.querySelector("#range-input");
    const rangeOutput = document.querySelector("#range-value");

    // Set initial value
    rangeOutput.textContent = rangeInput.value;

    rangeInput.addEventListener("input", function () {
      rangeOutput.textContent = this.value;
    });
  </script>
</html>
