<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta charset="utf-8"/>
    <link rel="stylesheet" href="/css/admin_globals.css"/>
    <link rel="stylesheet" href="/css/admin_styleguide.css"/>
    <link rel="stylesheet" href="/css/admin_style.css"/>
</head>
<body>
<div class="screen">
    <div class="div">
        <div class="overlap">
            <div class="group">
                <div class="chart-section">
                    <div class="chart-header">
                        <div class="title" th:text="|${currentYear} 거래 성사 내역 ${totalDoneTrades}|">
                            2025 거래 성사 내역 0
                        </div>
                        <a href="/admin/trade"><img class="user-interface-menu-6" src="/img/admin/menu.svg"/></a>
                    </div>

                    <canvas id="doneChart" width="700" height="320"></canvas>
                </div>
            </div>
        </div>

        <div class="overlap-4">
            <div class="overlap-5">
                <div class="text-wrapper-32">Total Trades</div>
                <div class="text-wrapper-33" th:text="${totalTradeCount}">100,345</div>
                <img class="vector" src="/img/admin/total_trade.svg"/></div>
            <div class="overlap-6"><img class="group-4" src="/img/admin/total_member.svg"/>
                <div class="text-wrapper-34">Total Members</div>
                <div class="text-wrapper-35" th:text="${totalMemberCount}">100,345</div>
            </div>
        </div>


        <!--        창고 가용률 섹션-->

        <div class="overlap-7">
            <div class="warehouse-status-section">
                <div class="text-wrapper-40">창고 현황</div>
                <a href="/admin/warehouse"><img class="user-interface-menu" src="/img/admin/menu.svg"/></a>

                <div class="warehouse-graph-wrapper">
                    <!-- A창고 -->
                    <div class="donut-chart">
                        <svg viewBox="0 0 36 36" class="donut">
                            <circle class="donut-bg" cx="18" cy="18" r="15.9155"/>
                            <circle class="donut-ring a"
                                    cx="18" cy="18" r="15.9155"
                                    th:stroke-dasharray="|${aUsage}, ${100 - aUsage}|"/>
                        </svg>
                        <div class="donut-center">
                            <div class="donut-text-top1" th:text="|${aUsage}%|">85%</div>
                            <div class="donut-text-bottom">A섹터</div>
                        </div>
                    </div>

                    <!-- B창고 -->
                    <div class="donut-chart">
                        <svg viewBox="0 0 36 36" class="donut">
                            <circle class="donut-bg" cx="18" cy="18" r="15.9155"/>
                            <circle class="donut-ring b"
                                    cx="18" cy="18" r="15.9155"
                                    th:stroke-dasharray="|${bUsage}, ${100 - bUsage}|"/>
                        </svg>
                        <div class="donut-center">
                            <div class="donut-text-top2" th:text="|${bUsage}%|">66%</div>
                            <div class="donut-text-bottom">B섹터</div>
                        </div>
                    </div>

                    <!-- C창고 -->
                    <div class="donut-chart">
                        <svg viewBox="0 0 36 36" class="donut">
                            <circle class="donut-bg" cx="18" cy="18" r="15.9155"/>
                            <circle class="donut-ring c"
                                    cx="18" cy="18" r="15.9155"
                                    th:stroke-dasharray="|${cUsage}, ${100 - cUsage}|"/>
                        </svg>
                        <div class="donut-center">
                            <div class="donut-text-top3" th:text="|${cUsage}%|">90%</div>
                            <div class="donut-text-bottom">C섹터</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>


        <!--        회원 정보 섹션-->

        <div class="overlap-11">
            <div class="member-box-header">
                <div class="text-wrapper-46">회원 정보</div>
                <a href="/admin/member"><img class="user-interface-menu-2" src="/img/admin/menu.svg"/></a>
            </div>

            <div class="member-stats-container">
                <!-- 임대인 -->
                <div class="member-stat-row">
                    <div class="member-label">임대인</div>
                    <div class="member-bar-row">
                        <div class="member-bar-wrapper">
                            <div class="member-bar owner"
                                 th:style="|width: ${(roleStats.owner * 100) / roleStats.total}%|"></div>
                        </div>
                        <div class="member-percent"
                             th:text="|${(roleStats.owner * 100 / roleStats.total).intValue()}%|"></div>
                    </div>
                </div>

                <!-- 임차인 -->
                <div class="member-stat-row">
                    <div class="member-label">임차인</div>
                    <div class="member-bar-row">
                        <div class="member-bar-wrapper">
                            <div class="member-bar renter"
                                 th:style="|width: ${(roleStats.renter * 100) / roleStats.total}%|"></div>
                        </div>
                        <div class="member-percent"
                             th:text="|${(roleStats.renter * 100 / roleStats.total).intValue()}%|"></div>
                    </div>
                </div>

                <!-- 기타 -->
                <div class="member-stat-row">
                    <div class="member-label">기타</div>
                    <div class="member-bar-row">
                        <div class="member-bar-wrapper">
                            <div class="member-bar other"
                                 th:style="|width: ${(roleStats.other * 100) / roleStats.total}%|"></div>
                        </div>
                        <div class="member-percent"
                             th:text="|${(roleStats.other * 100 / roleStats.total).intValue()}%|"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="overlap-13">
            <!-- Gaji 로고 -->
            <a href="/admin/dashboard">
                <img class="layer" src="/img/admin/layer-1.svg"/>
            </a>


            <!-- Warehouse -->
            <a href="/admin/warehouse">
                <img class="design-tools-grid" src="/img/admin/grid.svg"/>
                <div class="text-wrapper-54">Warehouse</div>
            </a>


            <!-- Trades -->
            <a href="/admin/trade">
                <div class="text-wrapper-55">Trades</div>
                <img class="vector-2" src="/img/admin/vector.svg"/>
            </a>


            <!-- Dashboard -->
            <a href="/admin/dashboard">
                <div class="text-wrapper-56">Dashboard</div>
                <img class="monochrome-layer" src="/img/admin/layer-group-y.svg"/>
            </a>

            <!-- Members -->
            <a href="/admin/member">
                <div class="text-wrapper-57">members</div>
                <img class="users-users" src="/img/admin/users.svg"/>
            </a>

            <!-- Forwarding -->

            <a href="/admin/forwarding/inbound">
                <img class="users-users2" src="/img/admin/forward.svg"/>
                <div class="text-wrapper-115">forwarding</div>
            </a>

            <!-- Request -->

            <a href="/admin/forwarding/list">
                <img class="users-users3" src="/img/admin/request.svg"/>
                <div class="text-wrapper-116">Request</div>
            </a>

            <a href="/logout" onclick="document.getElementById('logout-form').submit(); return false;">
                <div class="text-wrapper-53">Logout</div>
            </a>
            <form id="logout-form" th:action="@{/logout}" method="post" style="display: none;"></form>
            <img class="user-interface" src="/img/admin/logout.svg"/>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:inline="javascript">
    const doneData = [[${doneCounts}]]; // 서버에서 전달된 12개월 DONE 거래 수
    const labels = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
        'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    const ctx = document.getElementById('doneChart').getContext('2d');
    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: 'DONE 거래 수',
                data: doneData,
                backgroundColor: '#ffc107',
                borderRadius: 10,
                barThickness: 20 // <-- bar의 절대 너비(px) 설정
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        stepSize: 1
                    }
                }
            },
            plugins: {
                legend: {
                    display: false
                }
            }
        }
    });
</script>

</body>
</html>
