<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta charset="utf-8"/>
    <link rel="stylesheet" href="/css/admin_globals.css"/>
    <link rel="stylesheet" href="/css/admin_member_style.css"/>
    <link rel="stylesheet" href="/css/admin_member_styleguide.css"/>
    <title>Members</title>
</head>
<body>
<div class="screen">
    <div class="div">
        <div class="text-wrapper">Members Detail</div>
        <a href="/admin/member" class="back-button">← 돌아가기</a>
        <div class="search-top2">
            <div th:text="|${userId}님의 게시글 목록|"></div>
        </div>


        <!-- 게시글 목록 테이블 -->
        <div class="overlap">
            <div class="group">
                <div class="member-table-wrapper">


                    <table class="member-table">
                        <thead>
                        <tr>
                            <th>게시글 ID</th>
                            <th>제목</th>
                            <th>작성일</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="post : ${postList}">
                            <td th:text="${post.id}"></td>
                            <td>
                                <a th:href="@{'/main/detail/' + ${post.id}}"
                                   th:text="${post.title}"></a>
                            </td>
                            <td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd')}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 사이드바 -->
        <div class="overlap-9">
            <!-- Gaji 로고 -->
            <a href="/admin/dashboard">
                <img class="layer" src="/img/admin/layer-1.svg"/>
            </a>


            <!-- Warehouse -->
            <a href="/admin/warehouse">
                <img class="design-tools-grid" src="/img/admin/grid.svg"/>
                <div class="text-wrapper-12">Warehouse</div>
            </a>

            <!-- Trades -->
            <a href="/admin/trade">
                <div class="text-wrapper-13">Trades</div>
                <img class="vector" src="/img/admin/vector.svg"/>
            </a>


            <!-- Dashboard -->
            <a href="/admin/dashboard">
                <div class="text-wrapper-14">Dashboard</div>
                <img class="monochrome-layer" src="/img/admin/layer-group.svg"/>
            </a>

            <!-- Members -->
            <a href="/admin/member">
                <img class="users-users" src="/img/admin/users-y.svg"/>
                <div class="text-wrapper-15">members</div>
            </a>


            <!-- 로그아웃 버튼 -->
            <a href="#" onclick="document.getElementById('logout-form').submit(); return false;">
                <div class="text-wrapper-11">Logout</div>
            </a>
            <form id="logout-form" th:action="@{/logout}" method="post" style="display: none;"></form>
            <img class="img" src="/img/admin/logout.svg"/>
        </div>
    </div>
</div>
</body>
</html>
