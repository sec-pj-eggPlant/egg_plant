<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta charset="utf-8"/>
    <link rel="stylesheet" href="/css/admin_globals.css"/>
    <link rel="stylesheet" href="/css/admin_warehouse_style.css"/>
    <link rel="stylesheet" href="/css/admin_warehouse_styleguide.css"/>
    <title>Warehouse Detail</title>
</head>
<body>
<div class="screen">
    <div class="div">
        <div class="text-wrapper">Warehouse Detail</div>
        <a href="/admin/warehouse" class="back-button">← 돌아가기</a>

        <!-- 섹터 선택 버튼 영역 -->
        <form th:action="@{${'/admin/warehouse/detail/' + boxId}}" method="get" class="trade-search-form">
            <!-- 상단: 검색어 -->
            <div class="search-input-group">
                <input type="text" name="keyword" placeholder="이름을 입력해주세요." class="text-input"/>
                <input type="date" name="startDate" class="date-input"/>
                <span class="date-tilde">~</span>
                <input type="date" name="endDate" class="date-input"/>
                <button type="submit" class="date-search-button">검색</button>
            </div>
        </form>


        <!-- 데이터 테이블 -->
        <div class="overlap">
            <div class="group">
                <div class="items-wrapper">

                    <table class="member-table">
                        <thead>
                        <tr>
                            <th>회원 이름</th>
                            <th>연락처</th>
                            <th>대여 시작일</th>
                            <th>대여 종료일</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="use : ${usePage.content}">
                            <td th:text="${use.user.userName}">이름</td>
                            <td th:text="${use.user.tel}">전화번호</td>
                            <td th:text="${use.startDate}">시작일</td>
                            <td th:text="${use.endDate}">종료일</td>
                        </tr>
                        </tbody>
                    </table>




                </div>
                <!-- 페이지네이션 -->
                <nav th:if="${usePage.totalPages > 1}" class="pagination-wrapper">
                    <ul class="pagination">

                        <!-- 이전 -->
                        <li th:classappend="${usePage.first} ? 'disabled'" class="page-item">
                            <th:block th:with="
          prevPage=${usePage.number - 1},
          prevHref='page=' + ${prevPage} +
                    (${keyword} != null ? '&keyword=' + keyword : '') +
                    (${startDate} != null ? '&startDate=' + startDate : '') +
                    (${endDate} != null ? '&endDate=' + endDate : '')">
                                <a class="page-link"
                                   th:if="${!usePage.first}"
                                   th:href="@{'/admin/warehouse/detail/' + ${boxId} + '?' + ${prevHref}}">
                                    이전
                                </a>
                                <a class="page-link"
                                   th:if="${usePage.first}"
                                   href="#"
                                   style="pointer-events: none; color: #aaa;">
                                    이전
                                </a>
                            </th:block>
                        </li>

                        <!-- 페이지 번호 -->
                        <li th:each="i : ${#numbers.sequence(0, usePage.totalPages - 1)}"
                            th:classappend="${usePage.number == i} ? 'active'" class="page-item">
                            <th:block th:with="
          pageLink='page=' + ${i} +
                    (${keyword} != null ? '&keyword=' + keyword : '') +
                    (${startDate} != null ? '&startDate=' + startDate : '') +
                    (${endDate} != null ? '&endDate=' + endDate : '')">
                                <a class="page-link"
                                   th:href="@{'/admin/warehouse/detail/' + ${boxId} + '?' + ${pageLink}}"
                                   th:text="${i + 1}">
                                </a>
                            </th:block>
                        </li>

                        <!-- 다음 -->
                        <li th:classappend="${usePage.last} ? 'disabled'" class="page-item">
                            <th:block th:with="
          nextPage=${usePage.number + 1},
          nextHref='page=' + ${nextPage} +
                    (${keyword} != null ? '&keyword=' + keyword : '') +
                    (${startDate} != null ? '&startDate=' + startDate : '') +
                    (${endDate} != null ? '&endDate=' + endDate : '')">
                                <a class="page-link"
                                   th:if="${!usePage.last}"
                                   th:href="@{'/admin/warehouse/detail/' + ${boxId} + '?' + ${nextHref}}">
                                    다음
                                </a>
                                <a class="page-link"
                                   th:if="${usePage.last}"
                                   href="#"
                                   style="pointer-events: none; color: #aaa;">
                                    다음
                                </a>
                            </th:block>
                        </li>

                    </ul>
                </nav>
            </div>
        </div>

        <!-- 사이드바 -->
        <div class="overlap-9">
            <!-- Gaji 로고 -->
            <a href="/admin/dashboard">
                <img class="layer" src="/img/admin/layer-1.svg"/>
            </a>
            <div class="text-wrapper-11">Logout</div>

            <!-- Warehouse -->
            <a href="/admin/warehouse">
                <img class="design-tools-grid" src="/img/admin/grid-y.svg"/>
                <div class="text-wrapper-12">Warehouse</div>
            </a>

            <!-- Trades -->
            <a href="/admin/trade">
                <div class="text-wrapper-13">Trades</div>
                <img class="vector" src="/img/admin/vector.svg"/>
            </a>


            <!-- Dashboard -->
            <a href="/admin/dashboard">
                <div class="text-wrapper-14">Dashboard</div>
                <img class="monochrome-layer" src="/img/admin/layer-group.svg"/>
            </a>

            <!-- Members -->
            <a href="/admin/member">
                <img class="users-users" src="/img/admin/users.svg"/>
                <div class="text-wrapper-15">members</div>
            </a>

            <img class="img" src="/img/admin/logout.svg"/>
        </div>
    </div>
</div>
</body>
</html>
